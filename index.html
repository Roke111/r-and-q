<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#160e1d">
<meta name="format-detection" content="telephone=no">
<title>我们的纪念册 · 一周年</title>
<meta name="description" content="一份写给我们的纪念册，向上滑动翻页。">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="我们的纪念册 · 一周年">
<meta property="og:description" content="一份写给我们的纪念册，向上滑动翻页。">
<meta property="og:image" content="assets/og-cover.jpg">
<meta name="twitter:card" content="summary_large_image">
<!-- 字体全部走系统黑体（见 css 里的 --font），不加载任何外部 CDN：
     离线可打开、国内和微信里不会掉字，也不向第三方发请求。 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Cpath%20d='M16%2028C8%2022%202%2017.5%202%2011.8%202%207.5%205.4%204%209.6%204c2.5%200%204.8%201.2%206.4%203.2C17.6%205.2%2019.9%204%2022.4%204%2026.6%204%2030%207.5%2030%2011.8c0%205.7-6%2010.2-14%2016.2z'%20fill='%23ff8fb1'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="progress" id="progress" aria-hidden="true"></div>

<main class="deck" id="deck">

  <!-- ============ 01 封面 ============ -->
  <section class="card card--cover" id="c1" data-title="封面">
    <div class="glow" aria-hidden="true"></div>
    <div class="card-inner center">
      <p class="eyebrow reveal" id="coverEyebrow"></p>
      <h1 class="title reveal" id="coverTitle"></h1>
      <p class="names reveal" id="coverNames"></p>
      <p class="date reveal" id="coverDate"></p>
      <div class="hint reveal" id="scrollHint"><i></i><span>向上滑动</span></div>
    </div>
  </section>

  <!-- ============ 02 相识时间线 ============ -->
  <section class="card" id="c2" data-title="相识时间线">
    <div class="card-inner">
      <header class="head reveal"><span class="idx">02</span><h2>相识时间线</h2></header>
      <ol class="timeline" id="timeline"></ol>
    </div>
  </section>

  <!-- ============ 03 一起去过的地方 ============ -->
  <section class="card" id="c3" data-title="去过的地方">
    <div class="card-inner">
      <header class="head reveal"><span class="idx">03</span><h2>一起去过的地方</h2></header>
      <div class="map reveal">
        <svg class="map-bg" viewBox="0 0 320 230" preserveAspectRatio="none" aria-hidden="true">
          <!-- 手绘风底图：色块 + 河流 -->
          <path class="blob b1" d="M18 62c-8-26 22-46 52-40s44 30 30 50-70 30-82-10z"/>
          <path class="blob b2" d="M196 158c-6-22 20-40 48-34s38 26 26 44-66 26-74-10z"/>
          <path class="blob b3" d="M120 30c14-16 46-14 54 4s-10 34-34 34-34-22-20-38z"/>
          <path class="river" d="M0 150c40-10 66 16 104 6s58-34 96-26 76 30 120 16"/>
        </svg>
        <ul class="map-points" id="mapPoints"></ul>
      </div>
      <p class="map-foot reveal" id="mapFoot"></p>
    </div>
  </section>

  <!-- ============ 04 我们的数据 ============ -->
  <section class="card" id="c4" data-title="我们的数据">
    <div class="card-inner">
      <header class="head reveal"><span class="idx">04</span><h2>我们的数据</h2></header>
      <div class="stats" id="stats"></div>
      <p class="stats-foot reveal" id="statsFoot"></p>
    </div>
  </section>

  <!-- ============ 05 照片回忆墙 ============ -->
  <section class="card" id="c5" data-title="照片回忆墙">
    <div class="card-inner">
      <header class="head reveal"><span class="idx">05</span><h2>照片回忆墙</h2></header>
      <div class="wall" id="wall"></div>
      <p class="wall-foot reveal" id="wallFoot"></p>
    </div>
  </section>

  <!-- ============ 06 共同爱好词云 ============ -->
  <section class="card" id="c6" data-title="共同爱好">
    <div class="card-inner">
      <header class="head reveal"><span class="idx">06</span><h2>我们共同的</h2></header>
      <div class="cloud reveal" id="cloud"></div>
    </div>
  </section>

  <!-- ============ 07 心情曲线 ============ -->
  <section class="card" id="c7" data-title="心情曲线">
    <div class="card-inner">
      <header class="head reveal"><span class="idx">07</span><h2>这一年我们的温度</h2></header>
      <div class="mood reveal">
        <svg id="moodSvg" viewBox="0 0 320 180" preserveAspectRatio="none" aria-label="关系温度变化曲线"></svg>
      </div>
      <ul class="mood-axis reveal" id="moodAxis"></ul>
      <p class="mood-foot reveal" id="moodFoot"></p>
    </div>
  </section>

  <!-- ============ 08 一起完成的小目标 ============ -->
  <section class="card" id="c8" data-title="完成的小目标">
    <div class="card-inner">
      <header class="head reveal"><span class="idx">08</span><h2>一起完成的小目标</h2></header>
      <ul class="goals" id="goals"></ul>
    </div>
  </section>

  <!-- ============ 09 最心动的瞬间 ============ -->
  <section class="card" id="c9" data-title="心动的瞬间">
    <div class="card-inner">
      <header class="head reveal"><span class="idx">09</span><h2>最让我心动的瞬间</h2></header>
      <div class="moments" id="moments"></div>
    </div>
  </section>

  <!-- ============ 10 未来愿望清单 ============ -->
  <section class="card" id="c10" data-title="未来愿望">
    <div class="card-inner">
      <header class="head reveal"><span class="idx">10</span><h2>想和你一起做的事</h2></header>
      <p class="tip reveal" id="wishTip"></p>
      <ul class="wishes" id="wishes"></ul>
    </div>
  </section>

  <!-- ============ 11 结尾 ============ -->
  <section class="card card--end" id="c11" data-title="写在最后">
    <div class="card-inner center">
      <p class="eyebrow reveal" id="endEyebrow"></p>
      <h2 class="end-title reveal" id="endTitle"></h2>
      <div class="letter reveal" id="letter"></div>
      <p class="sign reveal" id="endSign"></p>
      <button class="egg reveal" id="eggBtn" type="button">
        <span>点我</span>
      </button>
    </div>
  </section>

</main>

<nav class="dots" id="dots" aria-label="卡片导航"></nav>

<button class="bgm" id="bgmBtn" type="button" aria-label="播放背景音乐" aria-pressed="false">
  <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
</button>
<p class="bgm-label" id="bgmLabel" hidden aria-hidden="true"></p>

<audio id="bgm" loop preload="none" playsinline>
  <source src="assets/bgm.m4a" type="audio/mp4">
  <source src="assets/bgm.mp3" type="audio/mpeg">
</audio>

<div class="hearts" id="hearts" aria-hidden="true"></div>

<div class="no-audio" id="noAudio" hidden>
  背景音乐未找到：把音频放到 <code>assets/bgm.m4a</code> 或 <code>assets/bgm.mp3</code>
</div>

<script src="js/data.js"></script>
<script src="js/data.local.js"></script>
<script src="js/main.js"></script>
</body>
</html>
